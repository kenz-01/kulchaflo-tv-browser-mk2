name: TV cloud emulator qualification

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/tv-cloud-emulator-qualification.yml"
      - "tools/player-lab/scripts/tv-cloud-emulator-qualification.sh"

permissions:
  contents: read

concurrency:
  group: tv-cloud-qualify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Android TV x86_64 emulator smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Enable Android emulator KVM
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm || { echo "KVM unavailable on this standard runner"; exit 1; }
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Assemble existing emulator-compatible GeckoView APK
        run: |
          chmod +x gradlew
          ./gradlew :app-gv:assembleUniversalDebug --console=plain

      - name: Boot Android TV and exercise remote/navigation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: android-tv
          arch: x86_64
          profile: tv_1080p
          cores: 2
          ram-size: 2048M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash tools/player-lab/scripts/tv-cloud-emulator-qualification.sh

      - name: Upload bounded qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-cloud-emulator-qualification
          path: ${{ runner.temp }}/tv-emulator-qualification/
          if-no-files-found: ignore
          retention-days: 1
