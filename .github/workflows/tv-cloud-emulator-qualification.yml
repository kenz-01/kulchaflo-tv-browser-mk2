name: TV cloud emulator qualification

on:
  workflow_dispatch:
    inputs:
      test_profile:
        description: Select the neutral qualification or the separate ZNS source observation
        required: true
        type: choice
        default: qualification
        options:
          - qualification
          - zns

permissions:
  contents: read

concurrency:
  group: tv-cloud-qualify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Bounded Android TV diagnostic harness (not media acceptance)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Initialize fail-closed ZNS receipt
        env:
          TV_TEST_PROFILE: ${{ inputs.test_profile }}
          TV_COMMIT: ${{ github.sha }}
        run: |
          if [[ "$TV_TEST_PROFILE" != zns ]]; then exit 0; fi
          mkdir -p "$RUNNER_TEMP/tv-emulator-qualification"
          python3 - <<'PY'
          import json, os
          launch_names = ("browser_session_configured", "browser_view_attached", "zns_navigation_requested", "zns_navigation_started", "zns_navigation_completed", "zns_navigation_failed")
          receipt = {
              "schema_version": 1,
              "receipt_finalized": False,
              "harness_completed": False,
              "commit": os.environ.get("TV_COMMIT", "unknown"),
              "selected_profile": "zns",
              "source": {"url": "https://znsbahamas.com/", "identification": "official_zns_bahamas_route_requested", "observed": False},
              "infrastructure": {"emulator_boot": "unknown", "apk_install": "unknown", "app_launch": "unknown"},
              "app_state": {name: {"process": "unknown", "activity_foreground": "unknown", "window_focus": "unknown"} for name in ("after_launch", "after_dpad", "after_back")},
              "app_state_diagnostics": {name: {"pidof": "unavailable", "activity_foreground": "command_unavailable", "window_focus": "command_unavailable", "window_manager_focus": "command_unavailable", "input_focus": "command_unavailable", "focus_source": "unknown"} for name in ("after_launch", "after_dpad", "after_back", "after_failure")},
              "failure_state": {"process": "unknown", "activity_foreground": "unknown", "window_focus": "unknown"},
              "screenshots": {"after_launch": {"file": "zns-after-launch.png", "status": "missing"}, "after_dpad": {"file": "zns-after-dpad.png", "status": "missing"}, "after_back": {"file": "zns-after-back.png", "status": "missing"}, "after_failure": {"file": "zns-after-failure.png", "status": "missing"}},
              "actions": {"dpad_down_up_dispatched": "unknown", "back_dispatched": "unknown"},
              "launch_observations": {name: "unknown" for name in launch_names},
              "diagnostic_continuation": {"mode": "not_used", "additional_passive_observation": "no", "remote_keys_withheld": "no"},
              "log_capture": "incomplete",
              "observation_phases": [],
              "player_state": None,
              "video_time_advanced_observed": "no",
              "classification": "INCONCLUSIVE",
              "reason": "The workflow has not completed the selected source diagnostic.",
              "failure_stage": None,
              "launch_status": "unknown",
              "helper_initiated_playback": False,
              "live_stream_verified": False,
              "moving_picture_verified": False,
              "audio_output_verified": False,
              "physical_bravia_verified": False,
          }
          path = os.path.join(os.environ["RUNNER_TEMP"], "tv-emulator-qualification", "zns-diagnostic-receipt.json")
          with open(path, "w", encoding="utf-8") as stream:
              json.dump(receipt, stream, indent=2)
              stream.write("\n")
          PY

      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Enable Android emulator KVM
        id: kvm
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm || { echo "KVM unavailable on this standard runner"; exit 1; }
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Assemble existing emulator-compatible GeckoView APK
        id: apk_assembly
        run: |
          chmod +x gradlew
          ./gradlew :app-gv:assembleUniversalDebug --console=plain

      - name: Boot Android TV and run the selected on-demand test
        id: emulator_test
        uses: reactivecircus/android-emulator-runner@v2
        env:
          TV_TEST_PROFILE: ${{ inputs.test_profile }}
        with:
          api-level: 36
          target: android-tv
          arch: x86_64
          profile: tv_1080p
          cores: 2
          ram-size: 2048M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash tools/player-lab/scripts/tv-cloud-emulator-dispatch.sh "$TV_TEST_PROFILE"

      - name: Finalize ZNS receipt if prerequisites failed
        if: always()
        env:
          TV_TEST_PROFILE: ${{ inputs.test_profile }}
          TV_COMMIT: ${{ github.sha }}
          TV_JOB_STATUS: ${{ job.status }}
          TV_KVM_OUTCOME: ${{ steps.kvm.outcome }}
          TV_APK_ASSEMBLY_OUTCOME: ${{ steps.apk_assembly.outcome }}
          TV_EMULATOR_STEP_OUTCOME: ${{ steps.emulator_test.outcome }}
        run: |
          if [[ "$TV_TEST_PROFILE" != zns ]]; then exit 0; fi
          python3 - <<'PY'
          import json, os
          launch_names = ("browser_session_configured", "browser_view_attached", "zns_navigation_requested", "zns_navigation_started", "zns_navigation_completed", "zns_navigation_failed")
          path = os.path.join(os.environ["RUNNER_TEMP"], "tv-emulator-qualification", "zns-diagnostic-receipt.json")
          try:
              with open(path, encoding="utf-8") as stream:
                  receipt = json.load(stream)
          except (OSError, json.JSONDecodeError):
              receipt = {}
          if receipt.get("receipt_finalized"):
              raise SystemExit(0)
          os.makedirs(os.path.dirname(path), exist_ok=True)
          receipt.setdefault("source", {"url": "https://znsbahamas.com/", "identification": "official_zns_bahamas_route_requested", "observed": False})
          receipt.setdefault("infrastructure", {"emulator_boot": "unknown", "apk_install": "unknown", "app_launch": "unknown"})
          receipt.setdefault("app_state", {name: {"process": "unknown", "activity_foreground": "unknown", "window_focus": "unknown"} for name in ("after_launch", "after_dpad", "after_back")})
          receipt.setdefault("app_state_diagnostics", {name: {"pidof": "unavailable", "activity_foreground": "command_unavailable", "window_focus": "command_unavailable", "window_manager_focus": "command_unavailable", "input_focus": "command_unavailable", "focus_source": "unknown"} for name in ("after_launch", "after_dpad", "after_back", "after_failure")})
          receipt.setdefault("failure_state", {"process": "unknown", "activity_foreground": "unknown", "window_focus": "unknown"})
          receipt.setdefault("screenshots", {"after_launch": {"file": "zns-after-launch.png", "status": "missing"}, "after_dpad": {"file": "zns-after-dpad.png", "status": "missing"}, "after_back": {"file": "zns-after-back.png", "status": "missing"}, "after_failure": {"file": "zns-after-failure.png", "status": "missing"}})
          receipt.setdefault("actions", {"dpad_down_up_dispatched": "unknown", "back_dispatched": "unknown"})
          receipt.setdefault("launch_observations", {name: "unknown" for name in launch_names})
          receipt.setdefault("diagnostic_continuation", {"mode": "not_used", "additional_passive_observation": "no", "remote_keys_withheld": "no"})
          receipt.setdefault("navigation_attempts", [])
          receipt.setdefault("frame_lifecycle", {"iframe_load_watch_attached": "unknown", "iframe_load_event_after_watch": "unknown", "embedded_helper_active_observed": "unknown"})
          receipt.setdefault("harness_limits", {"max_navigation_attempts": 2, "max_recovery_attempts": 1, "max_navigation_window_seconds_per_attempt": 45, "max_log_snapshot_seconds": 6, "max_polls_per_attempt": 15, "poll_interval_seconds": 2, "post_embed_observation_polls": 5})
          receipt.setdefault("log_capture", "incomplete")
          receipt.setdefault("observation_phases", [])
          receipt.setdefault("player_state", None)
          receipt.setdefault("video_time_advanced_observed", "no")
          if os.environ.get("TV_KVM_OUTCOME") == "failure":
              failure_stage = "kvm_preflight"
              classification = "INFRA_FAILURE"
              reason = "The KVM preflight failed before the emulator test started."
          elif os.environ.get("TV_APK_ASSEMBLY_OUTCOME") == "failure":
              failure_stage = "apk_assembly"
              classification = "INFRA_FAILURE"
              reason = "The emulator-compatible APK assembly failed before emulator execution."
          elif os.environ.get("TV_EMULATOR_STEP_OUTCOME") == "failure":
              failure_stage = "emulator_step"
              classification = "INCONCLUSIVE"
              reason = "The combined emulator boot/test step failed before it produced a finalized diagnostic receipt."
          else:
              failure_stage = "workflow_setup"
              classification = "INFRA_FAILURE" if os.environ.get("TV_JOB_STATUS") == "failure" else "INCONCLUSIVE"
              reason = "The workflow ended before the emulator diagnostic produced its final receipt."
          receipt.update({
              "schema_version": 1,
              "receipt_finalized": True,
              "harness_completed": False,
              "commit": os.environ.get("TV_COMMIT", "unknown"),
              "selected_profile": "zns",
              "classification": classification,
              "reason": reason,
              "failure_stage": failure_stage,
              "launch_status": receipt.get("launch_status", "unknown"),
              "helper_initiated_playback": False,
              "live_stream_verified": False,
              "moving_picture_verified": False,
              "audio_output_verified": False,
              "physical_bravia_verified": False,
              "diagnostic_success": False,
              "diagnostic_cause": "not_established",
              "playback_progression": "unknown",
              "device_acceptance": "not_tested",
          })
          with open(path, "w", encoding="utf-8") as stream:
              json.dump(receipt, stream, indent=2)
              stream.write("\n")
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as stream:
                  stream.write("## ZNS diagnostic harness report\n\n")
                  stream.write(f"- Classification: `{receipt['classification']}`\n")
                  stream.write(f"- Commit: `{receipt['commit']}`\n")
                  stream.write(f"- Harness success: `{str(receipt.get('harness_completed', False)).lower()}`\n")
                  stream.write(f"- Diagnostic success: `{str(receipt.get('diagnostic_success', False)).lower()}`; cause: `{receipt.get('diagnostic_cause', 'not_established')}`\n")
                  stream.write(f"- Playback progression: `{receipt.get('playback_progression', 'unknown')}`; physical TV acceptance: `{receipt.get('device_acceptance', 'not_tested')}`\n")
                  stream.write("- The bounded diagnostic harness did not complete; this receipt does not verify live playback.\n")
          PY

      - name: Upload bounded qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-cloud-emulator-${{ inputs.test_profile }}
          path: |
            ${{ runner.temp }}/tv-emulator-qualification/
            !${{ runner.temp }}/tv-emulator-qualification/navigation-attempts/**
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload bounded navigation-attempt screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-cloud-emulator-${{ inputs.test_profile }}-navigation-attempts
          path: ${{ runner.temp }}/tv-emulator-qualification/navigation-attempts/*.png
          if-no-files-found: ignore
          retention-days: 1
