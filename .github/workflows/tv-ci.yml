name: TV deterministic CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tv-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    name: Android and Player Lab deterministic gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Compile and test GeckoView runtime
        run: ./gradlew :app-gv:test :app-gv:assembleBraviaRelease --console=plain
      - name: Set up Node for offline Player Lab tests
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tools/player-lab/package-lock.json
      - name: Install Player Lab JavaScript dependencies without browser download
        run: npm ci --ignore-scripts --prefix tools/player-lab
      - name: Check GeckoView media observer syntax
        run: node --check app-gv/src/main/assets/gv_media_observer/content.js
      - name: Run Player Lab deterministic tests
        run: npm test --prefix tools/player-lab -- --test-concurrency=1
      - name: Record Bravia APK provenance
        run: |
          apk=app-gv/build/outputs/apk/bravia/release/app-gv-bravia-release.apk
          echo "git_commit=$(git rev-parse HEAD)" > app-gv/build/outputs/apk/bravia/release/BUILD_PROVENANCE.txt
          sha256sum "$apk" >> app-gv/build/outputs/apk/bravia/release/BUILD_PROVENANCE.txt
      - name: Upload Bravia acceptance artifact
        uses: actions/upload-artifact@v4
        with:
          name: kulchaflo-bravia-acceptance
          path: |
            app-gv/build/outputs/apk/bravia/release/app-gv-bravia-release.apk
            app-gv/build/outputs/apk/bravia/release/BUILD_PROVENANCE.txt
          if-no-files-found: error
          retention-days: 7
