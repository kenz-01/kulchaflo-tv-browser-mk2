<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Nested Fixture Player</title>
    <script>
      window.__KFLAB_INTERACTION_COUNTERS__ = {
        click: 0,
        pointer: 0,
        keyboard: 0,
        play: 0,
        pause: 0,
        requestFullscreen: 0
      };
      document.addEventListener('click', () => { window.__KFLAB_INTERACTION_COUNTERS__.click += 1; }, true);
      document.addEventListener('pointerdown', () => { window.__KFLAB_INTERACTION_COUNTERS__.pointer += 1; }, true);
      document.addEventListener('pointerup', () => { window.__KFLAB_INTERACTION_COUNTERS__.pointer += 1; }, true);
      document.addEventListener('keydown', () => { window.__KFLAB_INTERACTION_COUNTERS__.keyboard += 1; }, true);
      document.addEventListener('keyup', () => { window.__KFLAB_INTERACTION_COUNTERS__.keyboard += 1; }, true);
      const originalPlay = HTMLMediaElement.prototype.play;
      HTMLMediaElement.prototype.play = function (...args) {
        window.__KFLAB_INTERACTION_COUNTERS__.play += 1;
        return originalPlay.apply(this, args);
      };
      const originalPause = HTMLMediaElement.prototype.pause;
      HTMLMediaElement.prototype.pause = function (...args) {
        window.__KFLAB_INTERACTION_COUNTERS__.pause += 1;
        return originalPause.apply(this, args);
      };
      const originalRequestFullscreen = Element.prototype.requestFullscreen;
      Element.prototype.requestFullscreen = function (...args) {
        window.__KFLAB_INTERACTION_COUNTERS__.requestFullscreen += 1;
        return originalRequestFullscreen.apply(this, args);
      };
    </script>
    <script src="/mock-player.js?token=nested-secret#nested-fragment"></script>
  </head>
  <body>
    <section
      id="nested-player"
      class="mock-player-wrapper jw-player-container"
      data-source-change-delay-ms="750"
      data-replacement-delay-ms="1500"
    >
      <video
        id="nested-video"
        class="html5-video nested-video"
        controls
        playsinline
        src="/sample-media.mp4?token=nested-media-secret#nested-media-fragment"
        aria-label="Nested fixture video"
      ></video>
      <button class="fixture-control play-button" aria-label="Nested play">Play</button>
    </section>
    <script>
      window.fixtureTiming = {
        sourceChangeDelayMs: 750,
        replacementDelayMs: 1500
      };
      window.fixtureLifecycle = [{ event: 'fixture-loaded', target: 'nested-video' }];
      setTimeout(() => {
        const video = document.getElementById('nested-video');
        if (video) {
          video.setAttribute('src', '/sample-media.mp4?token=changed-secret#changed-fragment');
          window.fixtureLifecycle.push({ event: 'source-changed', target: 'nested-video' });
        }
      }, window.fixtureTiming.sourceChangeDelayMs);
      setTimeout(() => {
        const oldVideo = document.getElementById('nested-video');
        if (oldVideo) {
          const replacement = oldVideo.cloneNode(true);
          replacement.id = 'nested-video-replacement';
          oldVideo.replaceWith(replacement);
          window.fixtureLifecycle.push({ event: 'media-replaced', target: 'nested-video-replacement' });
        }
      }, window.fixtureTiming.replacementDelayMs);
    </script>
  </body>
</html>
